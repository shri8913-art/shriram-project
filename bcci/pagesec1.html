<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>page1</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.hero-slide{
  position:relative;
  width:100%;
  height:420px;
  overflow:hidden;
}

.hero-slide iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to right,rgba(0,0,0,.7),rgba(0,0,0,.2));
  z-index:2;
  pointer-events:none;
}

.hero-content{
  position:absolute;
  bottom:40px;
  left:40px;
  color:white;
  max-width:550px;
  z-index:3;
}

.hero-content h2{
  font-weight:700;
}

.carousel-control-prev,
.carousel-control-next{
  z-index:5;
  width:6%;
}

.carousel-item{
  width:100%;
}
</style>
</head>

<body>

<div class="container my-4">

<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">

<div class="carousel-inner rounded-4 overflow-hidden">

<div class="carousel-item active">
  <div class="hero-slide">

    <iframe 
      src="https://www.youtube.com/embed/8gRY4YjqoVc"
      allowfullscreen>
    </iframe>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h2>RCB winning moment e sala cup namde</h2>
      <p>17th Feb, 2026</p>
    </div>

  </div>
</div>

<div class="carousel-item">
  <div class="hero-slide">

    <iframe 
      src="https://www.youtube.com/embed/nGteKMz9_o4"
      allowfullscreen>
    </iframe>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h2>When thala enters the ground</h2>
      <p>20th Feb, 2026</p>
    </div>

  </div>
</div>

<div class="carousel-item">
  <div class="hero-slide">

    <iframe 
      src="https://www.youtube.com/embed/oyV74sKKHCI"
      allowfullscreen>
    </iframe>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h2>Breaking Boundaries: Rohit Sharma 264</h2>
      <p>25th Feb, 2026</p>
    </div>

  </div>
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
  <span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
  <span class="carousel-control-next-icon"></span>
</button>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
