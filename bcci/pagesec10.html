<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        .sponsors{
  background:#0b1422;
  padding:60px 30px;
}

.sponsor-box{

  border-radius:22px;
  padding:40px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:40px;
  flex-wrap:wrap;

  border:2px solid #d7a24a;
  box-shadow:0 0 25px rgba(215,162,74,.3);
}

.sponsor-col{
  text-align:center;
  color:#d7a24a;
}

.sponsor-col small{
  display:block;
  margin-bottom:12px;
  font-size:12px;
  letter-spacing:1px;
}

.sponsor-col img{
  max-height:50px;
  filter:brightness(1.2);
}

.multi{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  justify-content:center;
}

.multi img{
  max-height:38px;
}

    </style>
</head>
<body>
