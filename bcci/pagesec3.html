    <style>
.videos-section{
  background:#243045;
  padding:40px 30px;
  color:white;
}

.videos-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.video-tabs{
  display:flex;
    position:relative;
  gap:30px;

}

   
.vtab{
   position:relative;
  cursor:pointer;
  padding-bottom:6px;
  cursor:pointer;
  opacity:.7;
  position:relative;
}

.vtab.active{
  opacity:1;
}

.vtab::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:3px;
  background:#ff2a2a;
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.vtab.active::after{
    transform:scaleX(1);

  content:"";
  position:absolute;
  width:100%;
  height:3px;
  background:red;
  left:0;
  bottom:-8px;
}

.videos-row{
  display:none;
  gap:25px;
  overflow-x:auto;
  scroll-behavior:smooth;
    animation:fade .35s ease;

}

.videos-row.active{
  display:flex;
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.video-card{
  min-width:280px;
  background:#173c6d;
  border-radius:14px;
  overflow:hidden;
  flex-shrink:0;
}

.thumb{
  position:relative;
  height:170px;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.play{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  border-radius:50%;
  padding:14px 18px;
  font-size:18px;
}

.video-info{
  padding:15px;
}

.date{
  opacity:.7;
  font-size:13px;
}

.video-info h4{
  margin:8px 0;
  font-size:16px;
}

.meta{
  font-size:13px;
  opacity:.8;
}

    </style>
</head>

<script>
function showVideos(id, tab){
  document.querySelectorAll(".videos-row")
    .forEach(row => row.classList.remove("active"));

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".vtab")
    .forEach(t => t.classList.remove("active"));

  tab.classList.add("active");
}
</script>
