<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 .honours{
  background:#273042;
  padding:60px 40px;
  color:white;
}

.honours h2{
  font-size:38px;
  margin-bottom:30px;
}

.honours-row{
  display:flex;
  gap:30px;
  overflow-x:auto;
  scroll-behavior:smooth;
  padding-bottom:20px;
}

.honours-row::-webkit-scrollbar{
  height:6px;
}

.honours-row::-webkit-scrollbar-thumb{
  background:#d34a3a;
  border-radius:10px;
}

.honour-card{
  min-width:260px;
  background:#2f4270;
  border-radius:14px;
  padding:25px;
  text-align:center;
  position:relative;
  flex-shrink:0;
}

.honour-card img{
  height:140px;
  margin:30px 0 15px;
  z-index:2;
  position:relative;
}

.honour-card p{
  font-size:18px;
  font-weight:600;
    transition:.3s ease;

}

.honour-card:hover{
  transform:translateY(-10px);
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}

.year{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  font-size:90px;
  font-weight:800;
  opacity:.12;
  pointer-events:none;
}

    </style>
</head>
<body>
    <section class="honours">

  <h2>Honours</h2>

  <div class="honours-row">

    <div class="honour-card">
      <span class="year">2025</span>
      <img src="https://documents.bcci.tv/bcci/images/Trophy/ICC_Women_ODI_WC25.png">
      <p>ICC Cricket World Cup</p>
    </div>

    


  </div>

</section>

    
</body>
</html>
