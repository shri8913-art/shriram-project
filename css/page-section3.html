<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paytm Style Section</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

.paytm-section{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:80px 120px;
}

.left{
    width:50%;
}

.upi-logo{
    width:150px;
    margin-bottom:20px;
}

.left h1{
    font-size:48px;
    line-height:1.2;
    margin-bottom:20px;
}

.left h1 span{
    color:#00baf2;
}

.left p{
    font-size:18px;
    color:#555;
    line-height:1.6;
    margin-bottom:30px;
}

.store-buttons img{
    width:160px;
    margin-right:15px;
    cursor:pointer;
}

.right{
    width:45%;
    display:flex;
    justify-content:center;
}

.phone{
    width:350px;
}
</style>

</head>
<body>

<section class="paytm-section">

    <div class="left">
        <img class="upi-logo" src="https://assetscdn1.paytm.com/images/catalog/view/342367/1725447383123.png">

        <h1>
            Pay anyone directly<br>
            from your <span>bank account</span>
        </h1>

        <p>
            Pay anyone, everywhere. Make contactless & secure payments in-stores
            or online using Paytm UPI or directly from your Bank Account.
            Plus, send & receive money from anyone.
        </p>

        <div class="store-buttons">
            <img src="https://assetscdn1.paytm.com/images/catalog/view_item/2834703/1725432129171.png">
            <img src="https://assetscdn1.paytm.com/images/catalog/view_item/2834704/1725432148873.png">
        </div>
    </div>

    <div class="right">
        <img class="phone" src="https://assetscdn1.paytm.com/images/catalog/view/1752741641420.png">
    </div>

</section>

</body>
</html>
