<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paytm Business Section</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

.section{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:90px 120px;
}

.left{
    width:45%;
}

.logo{
    width:130px;
    margin-bottom:20px;
}

.left h1{
    font-size:52px;
    line-height:1.2;
    margin-bottom:20px;
}

.left h1 span{
    color:#00baf2;
}

.left p{
    font-size:18px;
    color:#555;
    line-height:1.6;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    background:#002970;
    color:#fff;
    padding:14px 34px;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.right{
    width:50%;
    display:flex;
    justify-content:center;
}

.right img{
    width:420px;
}
</style>

</head>
<body>

<div class="section">

    <div class="left">
        <img class="logo" src="https://assetscdn1.paytm.com/images/catalog/view/342368/1725447964962.png">

        <h1>
            Accept payments<br>
            <span>online & offline</span>
        </h1>

        <p>
            Millions of small & big businesses use Paytm to accept payments anywhere any time
            with a wide range of solutions for all kind of merchants
        </p>

        <a href="#" class="btn">Learn More →</a>
    </div>

    <div class="right">
        <img src="https://assetscdn1.paytm.com/images/catalog/view/1752735625336.png">
    </div>

</div>

</body>
</html>
