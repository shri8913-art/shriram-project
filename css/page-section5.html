<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paytm Style Section</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f5f7fb;
}

.main{
    display:flex;
    gap:30px;
    padding:40px;
}

.left{
    background:#fff;
    padding:30px;
    border-radius:20px;
    width:70%;
}

.left h1{
    margin-bottom:25px;
}

.services{
    display:flex;
    gap:35px;
}

.card{
    text-align:center;
    width:120px;
    padding:15px;
    border-radius:12px;
    transition:0.3s ease;
}

.card img{
    width:50px;
    margin-bottom:10px;
}

.card:hover{
    background:#f2f6ff;
    box-shadow:0 6px 18px rgba(0,0,0,0.12);
    margin-top:-6px;}

.right img{
    
    width:300px;
    border-radius:20px;
}
.right:hover{
  background:#f2f6ff;
  box-shadow:0 6px 18px rgba(0,0,0,0.12);
    margin-top:-6px;
   
}
</style>
</head>

<body>

<div class="main">

    <div class="left">
        <h1>Recharges & Bill Payments</h1>

        <div class="services">

            <div class="card">
                <img src="https://assetscdn1.paytm.com/images/catalog/view_item/3179318/36886801089433092.png">
                <p>Mobile Recharge</p>
            </div>

            <div class="card">
                <img src="https://assetscdn1.paytm.com/images/catalog/view_item/3179317/36886820392724710.png">
                <p>DTH Recharge</p>
            </div>

            <div class="card">
                <img src="https://assetscdn1.paytm.com/images/catalog/view_item/3179320/36886837922197985.png">
                <p>Fastag Recharge</p>
            </div>

            <div class="card">
                <img src="https://assetscdn1.paytm.com/images/catalog/view_item/3179321/4291158023212300.png">
                <p>Electricity Bill</p>
            </div>

            <div class="card">
                <img src="https://assetscdn1.paytm.com/images/catalog/view_item/3179322/4291177446001440.png">
                <p>Loan EMI</p>
            </div>

            <div class="card">
                <img src="https://assetscdn1.paytm.com/images/catalog/view_item/3179319/36886901834673050.png">
                <p>View All</p>
            </div>

        </div>
    </div>

    <div class="right">
        <a href="https://paytm.com/download-paytm-app">
            <img src="https://assetscdn1.paytm.com/images/catalog/view_item/3179325/4291045606114157.png">
        </a>
    </div>

</div>

</body>
</html>
