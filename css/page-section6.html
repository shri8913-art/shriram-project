<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo Cards</title>

<style>
body{
  font-family:Arial;
  background:#f5f7fb;
}

.wrapper{
  width:90%;
  margin:auto;
}


.card{
  display:inline-block;
  width:320px;
  margin:15px;
  border-radius:20px;
  overflow:hidden;  
}


.card img{
  width:100%;
  
  display:block;
}

.card:hover{
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<div class="wrapper">

<div class="card">
<img src="https://assetscdn1.paytm.com/images/catalog/view_item/2988609/4291841603322316.png">
</div>

<div class="card">
<img src="https://assetscdn1.paytm.com/images/catalog/view_item/3022660/4291820506003774.png">
</div>

<div class="card">
<img src="https://assetscdn1.paytm.com/images/catalog/view_item/3134667/36887499051496070.png">
</div>

</div>

</body>
</html>
