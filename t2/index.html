<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyrie Q — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0e0e14;
    --cream: #f5f3ee;
    --accent: #e84c2b;
    --sky-light: #dce7ff;
    --sky-mid: #c8d6f5;
    --muted: #7a7a8c;
    --white: #ffffff;
  }

  body {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    overflow: hidden;
  }

  /* ── LEFT PANEL ── */
  .left-panel {
    background: linear-gradient(145deg, var(--sky-light) 0%, var(--sky-mid) 60%, #b8c8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 60px 40px;
  }

  .left-panel::before {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(240,165,0,0.18) 0%, transparent 70%);
    top: -80px; right: -80px;
    border-radius: 50%;
  }
  .left-panel::after {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(232,76,43,0.12) 0%, transparent 70%);
    bottom: -60px; left: -60px;
    border-radius: 50%;
  }

  .geo-ring {
    position: absolute;
    top: 12%; left: 8%;
    width: 80px; height: 80px;
    border: 2px solid rgba(14,14,20,0.08);
    border-radius: 50%;
    animation: spinSlow 20s linear infinite;
  }
  .geo-ring::after {
    content: '';
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(14,14,20,0.12);
    border-radius: 50%;
  }

  .geo-square {
    position: absolute;
    bottom: 18%; right: 10%;
    width: 50px; height: 50px;
    border: 2px solid rgba(14,14,20,0.08);
    transform: rotate(45deg);
    animation: floatBox 6s ease-in-out infinite;
  }

  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes floatBox {
    0%, 100% { transform: rotate(45deg) translateY(0); }
    50% { transform: rotate(45deg) translateY(-12px); }
  }

  .brand-lockup {
    position: relative; z-index: 2;
    text-align: center;
    animation: fadeUp 0.7s ease both;
  }

  .eagle-wrap {
    width: 420px; height: 420px;
    margin: 0 auto -44px;
    position: relative;
    animation: floatEagle 1s ease-in-out infinite;
  }

  @keyframes floatEagle {
    0%, 100% { transform: translateY(0px) rotate(-1deg); }
    50% { transform: translateY(-14px) rotate(1deg); }
  }

  .eagle-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 20px 50px rgba(14,14,20,0.18));
  }

  .eagle-svg-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9rem;
    filter: drop-shadow(0 20px 40px rgba(14,14,20,0.15));
  }

  .brand-name {
    font-family: 'Syne', sans-serif;
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 10px;
  }
  .brand-name span { color: var(--accent); }

  .brand-tagline {
    font-size: 0.9rem;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .feature-pills {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 48px;
    position: relative; z-index: 2;
    animation: fadeUp 0.7s 0.2s ease both;
  }

  .pill {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink);
  }
  .pill-icon { font-size: 1rem; }

  /* ── RIGHT PANEL ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 72px;
    background: var(--white);
    position: relative;
  }

  .right-panel::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 200px; height: 200px;
    background: radial-gradient(circle at top right, var(--sky-light) 0%, transparent 70%);
    opacity: 0.5;
  }

  .login-form-wrap {
    width: 100%;
    max-width: 360px;
    position: relative; z-index: 2;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .form-eyebrow {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .form-eyebrow::before {
    content: '';
    display: block; width: 24px; height: 2px;
    background: var(--accent); border-radius: 1px;
  }

  .form-title {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .form-sub {
    font-size: 0.875rem;
    font-weight: 300;
    color: var(--muted);
    margin-bottom: 40px;
    line-height: 1.6;
  }

  .field-group { margin-bottom: 18px; }

  .field-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.02em;
    margin-bottom: 7px;
  }

  .field-input {
    width: 100%;
    background: #f8f7f5;
    border: 1.5px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .field-input::placeholder { color: #b0aeb8; }
  .field-input:focus {
    background: white;
    border-color: var(--ink);
    box-shadow: 0 0 0 4px rgba(14,14,20,0.06);
  }

  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
  }

  .forgot-link {
    font-size: 0.75rem;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .forgot-link:hover { color: var(--accent); }

  .btn-login {
    width: 100%;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 100px;
    padding: 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    margin-top: 8px;
    letter-spacing: 0.01em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-decoration: none;
  }
  .btn-login:hover {
    background: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(232,76,43,0.25);
    color: white;
  }
  .btn-login .arrow { transition: transform 0.2s; font-size: 1rem; }
  .btn-login:hover .arrow { transform: translateX(4px); }

  .divider {
    display: flex; align-items: center; gap: 14px;
    margin: 28px 0;
    color: #ccc;
    font-size: 0.75rem;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1;
    height: 1px; background: #ebebeb;
  }

  .btn-google {
    width: 100%;
    background: white;
    border: 1.5px solid #e5e5e5;
    border-radius: 100px;
    padding: 13px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .btn-google:hover {
    border-color: var(--ink);
    box-shadow: 0 4px 16px rgba(14,14,20,0.08);
    transform: translateY(-1px);
  }
  .google-icon { width: 18px; height: 18px; }

  .signup-row {
    margin-top: 32px;
    text-align: center;
    font-size: 0.83rem;
    color: var(--muted);
  }
  .signup-row a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    transition: color 0.2s, border-color 0.2s;
  }
  .signup-row a:hover { color: var(--accent); border-color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    body { grid-template-columns: 1fr; }
    .left-panel { display: none; }
    .right-panel { padding: 48px 32px; }
  }
</style>
</head>
<body>

<!-- LEFT BRAND PANEL -->
<div class="left-panel">
  <div class="geo-ring"></div>
  <div class="geo-square"></div>

  <div class="brand-lockup">
    <div class="eagle-wrap">
      <img src="/template/eagle2.png" alt="Eyrie Q Eagle"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="eagle-svg-fallback" style="display:none;">🦅</div>
    </div>
    <div class="brand-name">Eyrie <span>Q</span></div>
    <div class="brand-tagline">Learn without limits</div>
  </div>

  <div class="feature-pills">
    <div class="pill"><span class="pill-icon">📚</span> 500+ expert-led courses</div>
    <div class="pill"><span class="pill-icon">🏆</span> Track your progress</div>
    <div class="pill"><span class="pill-icon">⚡</span> Learn at your own pace</div>
  </div>
</div>

<!-- RIGHT LOGIN PANEL -->
<div class="right-panel">
  <div class="login-form-wrap">

    <div class="form-eyebrow">Welcome back</div>
    <h1 class="form-title">Sign in to<br>your account</h1>
    <p class="form-sub">Continue your learning journey where you left off.</p>

    <div class="field-group">
      <label class="field-label" for="email">Email address</label>
      <input id="email" type="email" class="field-input" placeholder="you@example.com" required>
    </div>

    <div class="field-group">
      <div class="field-row">
        <label class="field-label" for="password" style="margin-bottom:0">Password</label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <input id="password" type="password" class="field-input" placeholder="••••••••" required style="margin-top:7px">
    </div>

    <a href="main.html" class="btn-login">
      Login <span class="arrow">→</span>
    </a>

    <div class="divider">or continue with</div>

    <button class="btn-google">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>

    <div class="signup-row">
      Don't have an account? <a href="#">Create one free</a>
    </div>

  </div>
</div>

</body>
</html>
