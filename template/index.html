<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    min-height:100vh;
    background: linear-gradient(180deg,#cfd9ff 0%, #ffffff 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: system-ui, -apple-system, sans-serif;
}


.eagle-logo{
    width:180px;
    height:auto;
    display:block;     /* THIS FIXES THE GAP */
    margin:0 auto 15px auto;
}

.login-card{
    background:white;
     padding: 25px;
    border-radius:20px;
    width:100%;
    max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,0.15);
    text-align:center;
}

.login-logo{
    font-size:28px;
    font-weight:700;
    margin-bottom:10px;
}

.login-sub{
    color:#666;
    margin-bottom:30px;
}

.form-control{
    border-radius:12px;
    padding:12px;
}

.btn-login{
    width:100%;
    background:black;
    color:white;
    border-radius:30px;
    padding:12px;
    font-weight:600;
}

.btn-login:hover{
    background:#222;
}

.extra-links{
    margin-top:15px;
    font-size:14px;
}

.extra-links a{
    text-decoration:none;
    color:#4b63ff;
}
</style>
</head>
<body>

<div class="login-card">

    <img src="eagle2.png" class="eagle-logo" alt="Eyrie Logo">
    <div class="login-logo"> Eyrie Q</div>
    <div class="login-sub">Welcome back! Login to continue</div>

    <form>
        <div class="mb-3">
            <input type="email" class="form-control" placeholder="Email address" required>
        </div>

        <div class="mb-3">
            <input type="password" class="form-control" placeholder="Password" required>
        </div>

        <a href="main.html" class="btn btn-login">Login</a>
    </form>

    <div class="extra-links">
        <a href="#">Forgot password?</a> • 
        <a href="#">Create account</a>
    </div>

</div>

</body>
</html>
