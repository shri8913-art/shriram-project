<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hero</title>

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg,#cfd9ff 0%, #ffffff 70%);
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg,#cfd9ff 0%, #ffffff 70%);
}

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    position: relative;
    overflow: hidden;
}

/* Eagle Background */
.hero::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: url("eagle.jpg") no-repeat center;
    background-size: contain;
    opacity: 0.08;   /* very soft watermark */
    z-index: 0;
}

/* Keep text above logo */
.hero-box {
    position: relative;
    z-index: 2;
}


h1 {
    font-size: 64px;
    font-weight: 500;
    margin-bottom: 20px;
}

p {
    font-size: 20px;
    color: #555;
    line-height: 1.6;
}

.btn {
    margin-top: 40px;
    display: inline-block;
    background: #000;
    color: white;
    padding: 18px 40px;
    border-radius: 40px;
    text-decoration: none;
    font-size: 18px;
    transition: 0.3s ease;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}



</style>
</head>
<body>

<section class="hero">
    <div class="hero-box">


        <h1>Eyrie Q</h1>

        <p>
           Best place where you can learn new things and improve your skills,
        </p>

        <a href="#" class="btn">Experience Eyrie Q</a>

    </div>
</section>

</body>
</html>
